# Release von Hand: Actions → Release → Run workflow (auf main). Die Versionsnummer ergibt sich aus den
# Conventional Commits seit dem letzten Tag (bin/next-version.php: feat → minor, ! → major, sonst patch).
name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # Code per git statt actions/checkout: keine fremden Actions nötig. Das Token steht nur im
      # Header dieser Befehle, nicht in .git/config.
      - name: Code holen
        env:
          REPO: ${{ github.repository }}
          REF: ${{ github.sha }}
          TOKEN: ${{ github.token }}
        run: |
          git init -q . && git remote add origin "https://github.com/$REPO.git"
          AUTH="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          git -c http.extraheader="$AUTH" fetch -q --tags origin "+refs/heads/*:refs/remotes/origin/*" # Verlauf und Tags für die Versionsnummer
          git -c http.extraheader="$AUTH" fetch -q origin "$REF" # Commit, Tag oder Branch
          git checkout -q --detach "FETCH_HEAD^{commit}"
          git log -1 --format='Stand: %h %s'

      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="$(php bin/next-version.php)"
          if git rev-parse -q --verify "refs/tags/$V" > /dev/null; then echo "::notice::$V existiert schon"; exit 0; fi
          gh release create "$V" --target "$GITHUB_SHA" --title "$V" --generate-notes
