# Optional deployment via FTPS to shared hosting (bin/build.sh, bin/deploy.sh) on every push to
# main. Runs only if the variable FTP_HOST is set – so not in forks without setup.
# Setup: README, section "Deployment with GitHub Actions" (bin/setup-secrets.sh).
#
# Also usable as a reusable workflow: a separate repo containing only configuration (variables,
# secrets) calls it with a pinned TalkSlot version (`uses: …/deploy.yml@v1.2.0`) and gets exactly the
# code of that version, see README "Deploying from your own repository".
#
# Atomic: every version is uploaded completely into its own directory and only then made active via
# the pointer file; afterwards the site is checked and on failure switched back to the previous
# version at once. Manual rollback: workflow "Switch version" (switch.yml).
#
# Server layout (APP_DIR and WEB_DIR relative to the FTP root):
#   <APP_DIR>/current            name of the active version
#   <APP_DIR>/releases/<name>/   app/, bin/, config/config.php of a version
#   <APP_DIR>/app/var/           sessions, logs (shared by all versions)
#   <WEB_DIR>/                   index.php, .htaccess, app_root.php (document root)
#   <WEB_DIR>/v/<name>/          CSS, JS, images of a version
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Optional, normally empty. Defaults to the version in the caller's `uses:` line
        type: string
        default: ''
      repository:
        description: Optional, normally empty. Defaults to the repository of this workflow
        type: string
        default: ''

concurrency:
  group: deploy # shared with "Switch version": never two switches at the same time
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: vars.FTP_HOST != ''
    runs-on: ubuntu-latest
    # Secrets preferably in the environment "production", restricted to main (Settings → Environments)
    environment: production
    env:
      FTP_URL: ftp://${{ vars.FTP_HOST }}
      APP_DIR: ${{ vars.APP_DIR || 'talkslot-app' }}
      WEB_DIR: ${{ vars.WEB_DIR }}
      BASE_URL: ${{ vars.BASE_URL }}
      CONFIG_MODE: ${{ vars.CONFIG_MODE }} # permissions of config.php after the upload (default 600)
    steps:
      # Code via git instead of actions/checkout: no third-party actions needed. As a called workflow,
      # the TalkSlot code in the given version (TALKSLOT_TOKEN only for a private repo). The token is only in
      # the header of these commands, not in .git/config.
      - name: Fetch code
        env:
          # As a called workflow: the TalkSlot version named in the caller's `uses: …@<version>`
          REPO: ${{ inputs.repository || job.workflow_repository || github.repository }}
          REF: ${{ inputs.ref || job.workflow_sha || github.sha }}
          TOKEN: ${{ secrets.TALKSLOT_TOKEN || github.token }}
        run: |
          git init -q . && git remote add origin "https://github.com/$REPO.git"
          AUTH="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          git -c http.extraheader="$AUTH" fetch -q --tags origin "+refs/heads/*:refs/remotes/origin/*" # history and tags for the version number
          git -c http.extraheader="$AUTH" fetch -q origin "$REF" # commit, tag or branch
          git checkout -q --detach "FETCH_HEAD^{commit}"
          git log -1 --format='Checked out: %h %s'

      - name: Lint & unit tests
        run: |
          cp dev/config.dev.php config/config.php
          docker run --rm -v "$PWD:/app" -w /app php:8.5-cli sh -c '
            set -e
            find . -name "*.php" -not -path "./app/vendor/*" -print0 | xargs -0 -n1 php -l > /dev/null
            php tests/unit.php'
          rm config/config.php

      - name: Determine version
        id: version
        run: |
          V="$(git describe --tags --always)"
          # Directory name on the server: sortable and unique per run
          NAME="$(date -u +%Y%m%d-%H%M%S)-$(printf '%s' "$V" | tr -c 'A-Za-z0-9._-' '-')"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT" # TalkSlot commit, also when called from another repo
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "Version: $V, directory: $NAME"

      - name: Build
        env:
          APP_SECRET: ${{ secrets.APP_SECRET }}
          INSTALL_KEY: ${{ secrets.INSTALL_KEY }}
          ALLOW_INSTALL: ${{ vars.ALLOW_INSTALL }}
          DB_HOST: ${{ vars.DB_HOST }}
          DB_PORT: ${{ vars.DB_PORT }}
          DB_PREFIX: ${{ vars.DB_PREFIX || 'tp_' }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
          APP_NAME: ${{ vars.APP_NAME }}
          LANGUAGES: ${{ vars.LANGUAGES }}
          DEFAULT_LANGUAGE: ${{ vars.DEFAULT_LANGUAGE }}
          ADMIN_LANGUAGE: ${{ vars.ADMIN_LANGUAGE }}
          HOSTING_DE: ${{ vars.HOSTING_DE }}
          HOSTING_EN: ${{ vars.HOSTING_EN }}
          MAIL_TRANSPORT: ${{ vars.MAIL_TRANSPORT }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          MAIL_FROM_NAME: ${{ vars.MAIL_FROM_NAME }}
          MAIL_REPLY_TO: ${{ vars.MAIL_REPLY_TO }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_ENCRYPTION: ${{ vars.SMTP_ENCRYPTION }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE: ${{ steps.version.outputs.name }}
          COMMIT: ${{ steps.version.outputs.commit }}
        run: bin/build.sh

      # If a newer commit has been pushed to main in the meantime, its run (waiting in the
      # concurrency group) deploys everything anyway; this run then uploads nothing.
      - name: Still current?
        id: current
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          HEAD="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" -q .sha)"
          if [ -n "$HEAD" ] && [ "$HEAD" != "$GITHUB_SHA" ]; then
            echo "superseded=1" >> "$GITHUB_OUTPUT"
            echo "::notice::main has moved on to ${HEAD:0:7} – that run will deploy."
          fi

      - name: Install lftp
        if: github.ref == 'refs/heads/main' && steps.current.outputs.superseded != '1'
        run: sudo apt-get install -y -qq lftp > /dev/null

      # Upload via FTPS into a new directory; the running version stays untouched. config.php is restricted
      # to its owner (CONFIG_MODE, default 600); at the end it is verified that all files have arrived.
      # Only main goes live.
      - name: Upload (not active yet)
        id: upload
        if: github.ref == 'refs/heads/main' && steps.current.outputs.superseded != '1'
        env:
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
          NAME: ${{ steps.version.outputs.name }}
        run: |
          export LFTP_PASSWORD="$(printf '%s' "$FTP_PASS" | tr -d '\r\n')"
          bin/deploy.sh upload "$NAME"

      - name: Remove partial upload
        if: failure() && steps.upload.outcome == 'failure'
        env:
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
          NAME: ${{ steps.version.outputs.name }}
        run: |
          export LFTP_PASSWORD="$(printf '%s' "$FTP_PASS" | tr -d '\r\n')"
          bin/deploy.sh discard "$NAME"

      - name: Still current after upload?
        id: current_after
        if: github.event_name == 'push' && steps.current.outputs.superseded != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          HEAD="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" -q .sha)"
          if [ -n "$HEAD" ] && [ "$HEAD" != "$GITHUB_SHA" ]; then
            echo "superseded=1" >> "$GITHUB_OUTPUT"
            echo "::notice::main has moved on to ${HEAD:0:7} – that run will deploy, this one does not switch."
          fi

      - name: Discard (superseded)
        if: steps.current_after.outputs.superseded == '1'
        env:
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
          NAME: ${{ steps.version.outputs.name }}
        run: |
          export LFTP_PASSWORD="$(printf '%s' "$FTP_PASS" | tr -d '\r\n')"
          bin/deploy.sh discard "$NAME"

      # Replace the pointer file, update the fixed files in the web directory, check the site (otherwise
      # switch back at once), delete old versions (the last five are kept) and restrict their config.php too
      - name: Switch and check
        if: github.ref == 'refs/heads/main' && steps.current.outputs.superseded != '1' && steps.current_after.outputs.superseded != '1'
        env:
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
          NAME: ${{ steps.version.outputs.name }}
        run: |
          export LFTP_PASSWORD="$(printf '%s' "$FTP_PASS" | tr -d '\r\n')"
          bin/deploy.sh activate "$NAME"
          echo "Active: \`$NAME\`" >> "$GITHUB_STEP_SUMMARY"
