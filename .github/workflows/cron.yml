# Hourly "cron job" without a server crontab: calls the app's protected web cron
# (data deletion, expiry of rounds, summaries). The key is derived from APP_SECRET
# and only sent in a header. GitHub sometimes starts scheduled runs with a delay.
name: Cron
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cron
  cancel-in-progress: false
jobs:
  cron:
    if: vars.FTP_HOST != '' && vars.BASE_URL != '' # only with deployment set up
    runs-on: ubuntu-latest
    environment: production # APP_SECRET lives in the environment (main only)
    steps:
      - name: Call web cron
        env:
          APP_SECRET: ${{ secrets.APP_SECRET }}
          BASE_URL: ${{ vars.BASE_URL }}
        run: |
          SECRET="$(printf '%s' "$APP_SECRET" | tr -d '\r\n ')"
          TOKEN="$(printf 'cron' | openssl dgst -sha256 -hmac "$SECRET" | sed 's/.*= //')"
          echo "::add-mask::$TOKEN"
          curl -sS --fail --retry 3 --retry-delay 20 -m 120 -X POST -H "X-Cron-Token: $TOKEN" "${BASE_URL%/}/cron"
          echo
