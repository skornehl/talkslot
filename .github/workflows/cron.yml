# Stündlicher „Cronjob“ ohne Server-Crontab: ruft den geschützten Web-Cron der App auf
# (Datenlöschung, Ablauf von Runden, Zusammenfassungen). Der Schlüssel wird aus APP_SECRET
# abgeleitet und nur im Header gesendet. GitHub startet geplante Läufe teils mit Verzögerung.
name: Cron
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cron
  cancel-in-progress: false
jobs:
  cron:
    if: vars.FTP_HOST != '' && vars.BASE_URL != '' # nur mit eingerichtetem Deployment
    runs-on: ubuntu-latest
    environment: production # APP_SECRET liegt in der Umgebung (nur main)
    steps:
      - name: Web-Cron aufrufen
        env:
          APP_SECRET: ${{ secrets.APP_SECRET }}
          BASE_URL: ${{ vars.BASE_URL }}
        run: |
          SECRET="$(printf '%s' "$APP_SECRET" | tr -d '\r\n ')"
          TOKEN="$(printf 'cron' | openssl dgst -sha256 -hmac "$SECRET" | sed 's/.*= //')"
          echo "::add-mask::$TOKEN"
          curl -sS --fail --retry 3 --retry-delay 20 -m 120 -X POST -H "X-Cron-Token: $TOKEN" "${BASE_URL%/}/cron"
          echo
