# Lint und Unit-Tests auf allen unterstützten PHP-Versionen (ohne Datenbank).
# End-to-End-Tests (tests/smoke.sh, tests/deploy.sh) laufen lokal mit der Docker-Umgebung, siehe README.
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      # Code per git statt actions/checkout: keine fremden Actions nötig. Das Token steht nur im
      # Header dieser Befehle, nicht in .git/config.
      - name: Code holen
        env:
          REPO: ${{ github.repository }}
          REF: ${{ github.sha }}
          TOKEN: ${{ github.token }}
        run: |
          git init -q . && git remote add origin "https://github.com/$REPO.git"
          AUTH="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          git -c http.extraheader="$AUTH" fetch -q --depth=1 origin "$REF" # Commit, Tag oder Branch
          git checkout -q --detach "FETCH_HEAD^{commit}"
          git log -1 --format='Stand: %h %s'

      - name: Lint & Unit-Tests (PHP ${{ matrix.php }})
        run: |
          cp dev/config.dev.php config/config.php
          docker run --rm -v "$PWD:/app" -w /app "php:${{ matrix.php }}-cli" sh -c '
            set -e
            find . -name "*.php" -not -path "./app/vendor/*" -print0 | xargs -0 -n1 php -l > /dev/null
            php tests/unit.php'
