# Lint and unit tests on all supported PHP versions (without a database), plus the end-to-end
# tests (tests/smoke.sh) and browser tests (tests/browser.mjs) against the Docker environment from
# dev/. tests/deploy.sh (needs lftp) runs locally, see README.
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      # Code via git instead of actions/checkout: no third-party actions needed. The token is only in
      # the header of these commands, not in .git/config.
      - name: Fetch code
        env:
          REPO: ${{ github.repository }}
          REF: ${{ github.sha }}
          TOKEN: ${{ github.token }}
        run: |
          git init -q . && git remote add origin "https://github.com/$REPO.git"
          AUTH="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          git -c http.extraheader="$AUTH" fetch -q --depth=1 origin "$REF" # commit, tag or branch
          git checkout -q --detach "FETCH_HEAD^{commit}"
          git log -1 --format='Checked out: %h %s'

      - name: Lint & unit tests (PHP ${{ matrix.php }})
        run: |
          cp dev/config.dev.php config/config.php
          docker run --rm -v "$PWD:/app" -w /app "php:${{ matrix.php }}-cli" sh -c '
            set -e
            find . -name "*.php" -not -path "./app/vendor/*" -print0 | xargs -0 -n1 php -l > /dev/null
            php tests/unit.php'

  e2e:
    name: End-to-end and browser tests
    runs-on: ubuntu-latest
    steps:
      - name: Fetch code
        env:
          REPO: ${{ github.repository }}
          REF: ${{ github.sha }}
          TOKEN: ${{ github.token }}
        run: |
          git init -q . && git remote add origin "https://github.com/$REPO.git"
          AUTH="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          git -c http.extraheader="$AUTH" fetch -q --depth=1 origin "$REF"
          git checkout -q --detach "FETCH_HEAD^{commit}"
          git log -1 --format='Checked out: %h %s'

      - name: Start the Docker environment
        run: |
          cp dev/config.dev.php config/config.php
          docker compose -f dev/compose.yml up -d --build --wait --quiet-pull
          for i in $(seq 1 60); do [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/)" != 000 ] && break; sleep 1; done

      - name: Smoke tests
        run: dev/reset.sh && tests/smoke.sh

      - name: Browser tests (Chrome)
        run: |
          dev/reset.sh && dev/demo.sh
          # Node 22+ has WebSocket built in; older versions need the flag
          node $(node -e 'process.exit(typeof WebSocket === "undefined" ? 1 : 0)' || echo --experimental-websocket) tests/browser.mjs

      - name: Server log
        if: failure()
        run: docker compose -f dev/compose.yml logs --tail 200 app
