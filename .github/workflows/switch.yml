# Switch for the active version on the server (rollback without a new deployment).
# Actions → "Switch version" → Run workflow:
#   previous   one version back (default)
#   <name>     exactly this version, e.g. 20261102-153012-v1.9.0 (names: run with "list")
#   list       only show what is on the server
#   prune      delete all versions except the active one, e.g. after changing secrets (older versions
#              keep the old ones in their config.php); no rollback is possible afterwards
# After switching, the site is checked, with APP_SECRET also its database (health check; versions from
# before the health check get the page checks only); if that fails, the previous version stays active.
# The next push to main deploys the latest code again. The database is not rolled back:
# an older version runs with the newer schema as long as migrations only add columns/tables with
# default values (rule, see README "Deployment").
name: Switch version

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'previous, list, prune or version name'
        required: true
        default: previous
  # Called from a separate repo containing only configuration (see deploy.yml)
  workflow_call:
    inputs:
      target:
        type: string
        default: previous
      ref:
        description: Optional, normally empty. Defaults to the version in the caller's `uses:` line
        type: string
        default: ''
      repository:
        description: Optional, normally empty. Defaults to the repository of this workflow
        type: string
        default: ''
    # Declared so that a caller can pass them one by one instead of `secrets: inherit`; none is required. Secrets
    # in the environment "production" must be listed by name as well, or passed with `secrets: inherit`.
    secrets:
      APP_SECRET: { required: false }
      FTP_USERNAME: { required: false }
      FTP_PASSWORD: { required: false }
      TALKSLOT_TOKEN: { required: false, description: Only for a private TalkSlot repository }

concurrency:
  group: deploy # shared with "Deploy": never two switches at the same time
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  switch:
    runs-on: ubuntu-latest
    if: vars.FTP_HOST != ''
    environment: production # FTP credentials live in the environment (main only)
    timeout-minutes: 15
    env:
      FTP_URL: ftp://${{ vars.FTP_HOST }}
      APP_DIR: ${{ vars.APP_DIR || 'talkslot-app' }}
      WEB_DIR: ${{ vars.WEB_DIR }}
      BASE_URL: ${{ vars.BASE_URL }}
    steps:
      # Code via git instead of actions/checkout: no third-party actions needed. The token is only in
      # the header of these commands, not in .git/config.
      - name: Fetch code
        env:
          # As a called workflow: the TalkSlot version named in the caller's `uses: …@<version>`
          REPO: ${{ inputs.repository || job.workflow_repository || github.repository }}
          REF: ${{ inputs.ref || job.workflow_sha || github.sha }}
          TOKEN: ${{ secrets.TALKSLOT_TOKEN || github.token }}
        run: |
          git init -q . && git remote add origin "https://github.com/$REPO.git"
          AUTH="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          git -c http.extraheader="$AUTH" fetch -q --depth=1 origin "$REF" # commit, tag or branch
          git checkout -q --detach "FETCH_HEAD^{commit}"
          git log -1 --format='Checked out: %h %s'

      - name: Switch
        env:
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
          APP_SECRET: ${{ secrets.APP_SECRET }} # key of the health check; without it only the pages are checked
          TARGET: ${{ inputs.target }}
        run: |
          sudo apt-get install -y -qq lftp > /dev/null
          export LFTP_PASSWORD="$(printf '%s' "$FTP_PASS" | tr -d '\r\n')"
          TARGET="$(printf '%s' "$TARGET" | tr -d ' \r\n')"
          case "$TARGET" in
            list) ;;
            prune) bin/deploy.sh prune ;;
            *) bin/deploy.sh switch "$TARGET" ;;
          esac
          { echo '```'; bin/deploy.sh list; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
