# Local development only: docker compose -f dev/compose.yml up -d
name: talkslot-dev
services:
  db:
    image: mariadb:${MARIADB_VERSION:-11.8} # CI also runs the smoke tests on 10.6, the minimum
    environment:
      MARIADB_DATABASE: talkslot
      MARIADB_USER: app
      MARIADB_PASSWORD: app-dev-only
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      retries: 30
  mail:
    image: axllent/mailpit:v1.27
    ports: ["127.0.0.1:8025:8025"] # web interface showing all mails sent by the app
  app:
    build:
      context: .
      args: { COVERAGE: "${COVERAGE:-0}" } # 1: line coverage with PCOV (tests/coverage/report.php)
    ports: ["127.0.0.1:8080:80"]
    volumes: ["..:/srv/app"]
    depends_on:
      db: { condition: service_healthy }
